<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quản lý khóa ô tô CSHN</title>
<style>
:root{
  --bg:#f4f6fa; --panel:#fff; --ink:#1d2433; --muted:#667085; --line:#e3e7ef;
  --blue:#4472c4; --blue-d:#2f5597; --blue-l:#e8eef9; --amber:#ffc000; --amber-l:#fff6d6;
  --green:#5b9a3c; --green-l:#e9f4e3; --red:#c0392b; --red-l:#fdecea; --gray-l:#f1f3f7;
  --r:10px; --sh:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue-d)}
.app{display:grid;grid-template-columns:220px 1fr;height:100vh}
aside{background:#1f2a44;color:#cfd6e6;display:flex;flex-direction:column;padding:14px 10px;gap:4px;overflow:auto}
.brand{padding:6px 10px 14px;border-bottom:1px solid #33405f;margin-bottom:8px}
.brand b{display:block;color:#fff;font-size:15px;letter-spacing:.2px}
.brand small{color:#93a0bd}
.nav{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;cursor:pointer;color:#cfd6e6;border:0;background:none;text-align:left;width:100%}
.nav:hover{background:#2a3757}
.nav.on{background:var(--blue);color:#fff}
.nav .cnt{margin-left:auto;font-size:12px;background:#33405f;border-radius:10px;padding:0 7px}
.nav.on .cnt{background:rgba(255,255,255,.25)}
.aside-foot{margin-top:auto;font-size:12px;color:#93a0bd;padding:10px;border-top:1px solid #33405f}
main{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.top{display:flex;align-items:center;gap:12px;padding:10px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
.search{position:relative;flex:1;max-width:620px}
.search input{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--line);border-radius:8px;background:var(--gray-l)}
.search input:focus{outline:2px solid var(--blue-l);border-color:var(--blue);background:#fff}
.search svg{position:absolute;left:10px;top:10px;opacity:.5}
.sres{position:absolute;top:42px;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.12);max-height:70vh;overflow:auto;z-index:50;display:none}
.sres.show{display:block}
.sres .grp{font-size:11px;text-transform:uppercase;color:var(--muted);padding:8px 12px 4px;letter-spacing:.5px}
.sres .it{padding:8px 12px;cursor:pointer;display:flex;gap:10px;align-items:baseline}
.sres .it:hover,.sres .it.act{background:var(--blue-l)}
.sres .it small{color:var(--muted)}
.bk{display:flex;align-items:center;gap:6px;font-size:12.5px;padding:6px 10px;border-radius:20px;cursor:pointer;border:1px solid var(--line);background:#fff;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:#aaa;display:inline-block}
.dot.ok{background:#3aa55d}.dot.warn{background:#e6a100}.dot.err{background:var(--red)}
.view{flex:1;overflow:auto;padding:20px 24px 60px}
h1{font-size:22px;margin:0 0 4px}
h2{font-size:16px;margin:0 0 10px}
.sub{color:var(--muted);margin:0 0 18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin-bottom:16px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.stat{border-left:4px solid var(--blue)}
.stat .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.stat .v{font-size:26px;font-weight:700;margin:2px 0}
.stat .d{font-size:12.5px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#c5cddc;background:#fafbfd}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.pri:hover{background:var(--blue-d)}
.btn.ok{background:var(--green);border-color:var(--green);color:#fff}
.btn.dan{color:var(--red);border-color:#f0c5c0}
.btn.dan:hover{background:var(--red-l)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
table{border-collapse:collapse;width:100%}
.tbl{overflow:auto;border:1px solid var(--line);border-radius:8px;background:#fff}
.tbl table th{position:sticky;top:0;background:var(--blue);color:#fff;font-weight:600;text-align:left;padding:8px 10px;font-size:13px;white-space:nowrap;z-index:1}
.tbl table td{padding:6px 10px;border-top:1px solid var(--line);vertical-align:middle}
.tbl table tr:hover td{background:#fafbff}
.tbl tr.hl td{background:var(--amber-l)!important;transition:background 1s}
.tbl tr.out td{color:#9aa3b2;background:#fbfbfc}
.tbl tr.near td:first-child{box-shadow:inset 3px 0 0 var(--green)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.c{text-align:center}
.mono{white-space:nowrap;font-family:Consolas,"Cascadia Mono",monospace;font-size:12.5px}
.badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:600;white-space:nowrap}
.b-run{background:var(--green-l);color:#2e6b19}
.b-new{background:var(--amber-l);color:#8a6400}
.b-end{background:var(--gray-l);color:#5b6475}
.b-miss{background:var(--red-l);color:var(--red)}
.b-info{background:var(--blue-l);color:var(--blue-d)}
.hang{font-weight:700;color:var(--blue-d)}
input.in,select.in,textarea.in{padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:#fff;min-width:0}
input.in:focus,select.in:focus,textarea.in:focus{outline:2px solid var(--blue-l);border-color:var(--blue)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
label.f>*{color:var(--ink);font-size:14px}
.cell-in{border:1px solid transparent;background:transparent;padding:3px 5px;border-radius:5px;width:100%}
.cell-in:hover{border-color:var(--line)}
.cell-in:focus{border-color:var(--blue);background:#fff;outline:none}
select.gv{padding:4px 6px;border:1px solid var(--line);border-radius:6px;max-width:170px;background:#fff}
select.gv.empty{border-color:#f0c5c0;background:var(--red-l)}
.drop{border:2px dashed #b9c4d8;border-radius:12px;padding:26px;text-align:center;color:var(--muted);background:#fafbfe;cursor:pointer;transition:.15s}
.drop:hover,.drop.over{border-color:var(--blue);background:var(--blue-l);color:var(--blue-d)}
.drop b{color:var(--ink);font-size:15px}
.gdrop{position:fixed;inset:0;background:rgba(68,114,196,.18);border:4px dashed var(--blue);z-index:90;display:none;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:var(--blue-d);pointer-events:none}
.gdrop.show{display:flex}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:5px 11px;border-radius:16px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:13px;user-select:none}
.chip:hover{border-color:var(--blue)}
.chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.chip small{opacity:.7}
.paint td{cursor:copy}
.toast{position:fixed;right:20px;top:70px;display:flex;flex-direction:column;gap:8px;z-index:100}
.toast div{background:#1f2a44;color:#fff;padding:10px 14px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:420px;animation:tin .2s}
.toast div.err{background:var(--red)}
.toast div.ok{background:#2e7d32}
@keyframes tin{from{transform:translateY(10px);opacity:0}}
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;z-index:80;padding:20px}
.modal{background:#fff;border-radius:12px;max-width:620px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal header{padding:16px 20px;border-bottom:1px solid var(--line);font-weight:700;font-size:16px}
.modal .mb{padding:16px 20px}
.modal footer{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.note{background:var(--amber-l);border:1px solid #f3dc8a;border-radius:8px;padding:10px 12px;font-size:13px}
.note.blue{background:var(--blue-l);border-color:#c7d6f2}
.note.red{background:var(--red-l);border-color:#f0c5c0}
.empty-st{text-align:center;color:var(--muted);padding:30px}
.kbd{border:1px solid #c9d0dd;border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:11.5px;background:#fff;color:var(--muted)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tab{padding:8px 14px;border:0;background:none;cursor:pointer;border-bottom:2px solid transparent;color:var(--muted)}
.tab.on{color:var(--blue-d);border-color:var(--blue);font-weight:600}
.steps{display:flex;gap:8px;margin-bottom:14px}
.steps span{padding:5px 12px;border-radius:14px;background:var(--gray-l);color:var(--muted);font-size:13px}
.steps span.on{background:var(--blue);color:#fff}
.alert-li{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.alert-li:first-child{border-top:0}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.warn-t{color:#a15c00}
.stick{position:sticky;top:-20px;z-index:6}
.hs-steps{display:flex;align-items:center;gap:0;margin-top:12px;flex-wrap:wrap}
.hs-step{display:flex;align-items:center;gap:10px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;min-width:230px}
.hs-step.cur{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-l)}
.hs-step.done{border-color:#bfe0b0;background:var(--green-l)}
.hs-dot{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;background:var(--gray-l);color:var(--muted);flex:none}
.hs-step.cur .hs-dot{background:var(--blue);color:#fff}.hs-step.done .hs-dot{background:var(--green);color:#fff}
.hs-ck{margin-left:auto;padding-left:14px;font-size:13px;white-space:nowrap;cursor:pointer}
.hs-ck input{width:18px;height:18px;vertical-align:-4px}
.hs-line{width:28px;height:3px;background:var(--line);flex:none}.hs-line.done{background:var(--green)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-h{font-size:12px;font-weight:600;color:var(--muted);text-align:center;padding:4px}
.cal-c{min-height:92px;border:1px solid var(--line);border-radius:8px;padding:4px 6px;background:#fff;display:flex;flex-direction:column;gap:3px}
.cal-c.off{background:transparent;border:0}.cal-c.today{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue-l)}
.cal-d{font-size:12px;color:var(--muted);font-weight:600}
.cal-e{display:block;font-size:11.5px;padding:1px 6px;border-radius:5px;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-e.kg{background:var(--amber-l);color:#7a5800}.cal-e.bg{background:var(--blue-l);color:var(--blue-d)}
.hs-chip{display:flex;align-items:center;gap:6px;font-size:12.5px;padding:6px 10px;border-radius:20px;cursor:pointer;border:1px solid #f0c5c0;background:var(--red-l);color:var(--red);font-weight:600;white-space:nowrap}
.sticky-bar{position:sticky;bottom:-60px;background:#fff;border-top:1px solid var(--line);padding:12px 16px;margin:0 -24px -60px;display:flex;gap:10px;align-items:center;box-shadow:0 -4px 12px rgba(0,0,0,.05)}
@media (max-width:900px){.app{grid-template-columns:1fr}aside{display:none}}
</style>
</head>
<body>
<div class="app">
  <aside id="aside">
    <div class="brand"><b>QUẢN LÝ KHÓA Ô TÔ</b><small id="brandSub">Cơ sở Hoài Nhơn</small></div>
    <button class="nav" data-v="home">🏠 Tổng quan</button>
    <button class="nav" data-v="khoa">📚 Khóa học <span class="cnt" id="cntKhoa">0</span></button>
    <button class="nav" data-v="lich">📅 Lịch KG–BG <span class="cnt" id="cntHs" title="Khóa sắp khai giảng chưa chốt hồ sơ">0</span></button>
    <button class="nav" data-v="hv">🧑‍🎓 Học viên <span class="cnt" id="cntHv">0</span></button>
    <button class="nav" data-v="gv">👨‍🏫 Giáo viên <span class="cnt" id="cntGv">0</span></button>
    <button class="nav" data-v="madk">🔑 Kho mã ĐKI <span class="cnt" id="cntMiss" title="HV còn thiếu mã">0</span></button>
    <button class="nav" data-v="check">✅ Kiểm tra dữ liệu</button>
    <button class="nav" data-v="report">📊 Báo cáo</button>
    <div style="height:8px"></div>
    <button class="nav" data-v="backup">💾 Sao lưu &amp; Cài đặt</button>
    <button class="nav" data-v="audit">📜 Nhật ký thay đổi</button>
    <button class="nav" data-v="trash">🗑 Thùng rác <span class="cnt" id="cntTrash">0</span></button>
    <button class="nav" data-v="help">❓ Hướng dẫn</button>
    <div class="aside-foot">Kéo thả file Excel vào bất kỳ đâu trên màn hình để nhập.<br><br><span class="kbd">Ctrl</span>+<span class="kbd">K</span> tìm nhanh</div>
  </aside>
  <main>
    <div class="top">
      <div class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" placeholder="Tìm khóa (BSS-22, 22…), học viên (tên không dấu), CCCD, mã ĐKI, SĐT…  (Ctrl+K)" autocomplete="off">
        <div class="sres" id="sres"></div>
      </div>
      <div class="sp"></div>
      <div class="hs-chip" id="hsChip" style="display:none" title="Khóa sắp khai giảng chưa chốt hồ sơ"></div>
      <div class="bk" id="bkStatus" title="Trạng thái sao lưu"><span class="dot"></span><span>Sao lưu</span></div>
    </div>
    <div class="view" id="view"></div>
  </main>
</div>
<div class="gdrop" id="gdrop">Thả file Excel / file sao lưu vào đây</div>
<div class="toast" id="toast"></div>
<input type="file" id="filePick" accept=".xls,.xlsx,.xlsm,.csv,.json,.db" hidden>

<script>
'use strict';
/* =========================================================
   TIỆN ÍCH CHUNG
   ========================================================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad2 = n => String(n).padStart(2, '0');
const noAcc = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase();
const normName = s => String(s ?? '').replace(/\s+/g, ' ').trim().toUpperCase();
const normKey = s => noAcc(s).replace(/[^a-z0-9]/g, '');
function toast(msg, type = '', ms = 3500) {
  const d = document.createElement('div'); d.className = type; d.textContent = msg; d.dataset.t = Date.now();
  $('#toast').appendChild(d); setTimeout(() => d.remove(), ms);
}
/* Ngày: lưu nội bộ dạng ISO yyyy-mm-dd */
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; };
const isoToVN = iso => iso ? iso.split('-').reverse().join('/') : '';
function addDays(iso, n) { const [y, m, d] = iso.split('-').map(Number); const t = new Date(Date.UTC(y, m - 1, d + n)); return t.toISOString().slice(0, 10); }
function daysBetween(a, b) { const p = s => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); }; return Math.round((p(b) - p(a)) / 864e5); }
function serialToISO(n) { const t = new Date(Math.round((n - 25569) * 864e5)); return t.toISOString().slice(0, 10); }
/* Chuẩn hóa mọi kiểu ngày (serial Excel, dd/mm/yyyy, Date, yyyy-mm-dd) -> ISO */
function anyToISO(v) {
  if (v == null || v === '') return '';
  if (v instanceof Date && !isNaN(v)) return `${v.getFullYear()}-${pad2(v.getMonth() + 1)}-${pad2(v.getDate())}`;
  if (typeof v === 'number') return v > 1000 && v < 80000 ? serialToISO(v) : '';
  const s = String(v).trim();
  let m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/); if (m) return `${m[3]}-${pad2(m[2])}-${pad2(m[1])}`;
  m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if (m) return `${m[1]}-${pad2(m[2])}-${pad2(m[3])}`;
  if (/^\d+(\.\d+)?$/.test(s)) return anyToISO(Number(s));
  return '';
}
/* Ngày sinh giữ dạng chữ dd/mm/yyyy giống file nguồn */
function dobText(v) { if (v == null || v === '') return ''; if (typeof v === 'number') return v >= 1900 && v <= 2100 ? String(v) : isoToVN(serialToISO(v)); const s = String(v).trim(); const iso = anyToISO(s); return /^\d{4}$/.test(s) ? s : (iso ? isoToVN(iso) : s); }
/* CCCD: luôn là chuỗi, bù số 0 đầu nếu Excel làm mất */
function normCCCD(v) {
  if (v == null) return ''; let s = String(v).trim().replace(/\s|\.0+$/g, '');
  if (/^\d+$/.test(s)) { if (s.length === 11) s = '0' + s; else if (s.length === 8) s = '0' + s; }
  return s;
}
/* Sắp xếp tên tiếng Việt: tên riêng → họ → tên đệm (so sánh không dấu trước, có dấu sau) */
const VN_ORDER = 'aàảãáạăằẳẵắặâầẩẫấậbcdđeèẻẽéẹêềểễếệfghiìỉĩíịjklmnoòỏõóọôồổỗốộơờởỡớợpqrstuùủũúụưừửữứựvwxyỳỷỹýỵz';
function vnKey(s) { return [...String(s).toLowerCase()].map(ch => { const i = VN_ORDER.indexOf(ch); return i < 0 ? ch : String.fromCharCode(0x100 + i); }).join(''); }
function nameParts(full) { const p = normName(full).split(' ').filter(Boolean); return { ten: p[p.length - 1] || '', ho: p[0] || '', dem: p.slice(1, -1).join(' ') }; }
function vnCompare(a, b) {
  const A = nameParts(a), B = nameParts(b);
  for (const k of ['ten', 'ho', 'dem']) { const x = noAcc(A[k]), y = noAcc(B[k]); if (x !== y) return x < y ? -1 : 1; }
  for (const k of ['ten', 'ho', 'dem']) { const x = vnKey(A[k]), y = vnKey(B[k]); if (x !== y) return x < y ? -1 : 1; }
  return 0;
}

/* =========================================================
   LƯU TRỮ: máy chủ Python + SQLite (data/qlkhoa.db).
   Mất kết nối → giữ "bản chờ" trong trình duyệt, tự gửi lại khi có kết nối.
   ========================================================= */
const APP_VER = 2, TOOL_VERSION = '2.4.1';
const HV_TT = { hoc: 'Đang học', baoluu: 'Bảo lưu', bohoc: 'Bỏ học', xong: 'Hoàn thành' };
function blankDB() {
  return {
    app: 'QLKhoaOtoCSHN', ver: APP_VER, savedAt: '', rev: 0,
    settings: { maPrefix: '52002', coSo: 'Cơ sở Hoài Nhơn (CSHN)', donVi: 'Công ty CP ĐT và DV GTVT Bình Định', gvExport: 'short',
      tenDonViIn: 'CÔNG TY CP ĐT VÀ DV GTVT BÌNH ĐỊNH', tenCoSoIn: 'CƠ SỞ ĐÀO TẠO LÁI XE HOÀI NHƠN', diaDanh: 'Hoài Nhơn', nguoiLap: '', phuTrach: '',

async function readWorkbook(file) {

/* Tên sheet khóa trong file cũ: HẠNG-SỐ (BSS-22, BSTD-27, C1-21, hạng mới cũng nhận) */

function rowsFromAoa(aoa) {

      noiCuTru: String(get('noiCuTru') || '').trim(), ngayNhanHS: dobText(get('ngayNhanHS')), sdt: phoneText(get('sdt')), gvText: String(get('gv') || '').trim() });

/* Nhận diện file: file 1 cũ (có sheet KHOA), sao lưu JSON, hay danh sách HV */
async function sniffFile(file) {
  if (/\.(json|db)$/i.test(file.name)) return { kind: 'backup' };
  const head = new Uint8Array(await file.slice(0, 16).arrayBuffer());
  if (String.fromCharCode(...head).startsWith('SQLite format 3')) return { kind: 'backup' };
  const wb = await readWorkbook(file);
  if (wb.SheetNames.includes('KHOA') && wb.SheetNames.some(n => KSHEET.test(n))) return { kind: 'file1', wb };
  for (const n of wb.SheetNames) { const aoa = sheetAoa(wb.Sheets[n]); const h = findLichHeader(aoa); if (h && !(aoa[h.r] || []).some(c => normKey(c) === 'hovaten')) return { kind: 'lich', wb }; }
  for (const n of wb.SheetNames) { const res = rowsFromAoa(sheetAoa(wb.Sheets[n])); if (res && res.rows.length) return { kind: 'list', wb, sheet: n, ...res }; }
  return { kind: 'unknown', wb };
}

function importFile1(wb) {

  const gvS = wb.Sheets['GV'];
  if (gvS) {

    for (const r of a) { const n = normName(r[0]); if (!n || /^(TEN GIAO VIEN|QUAN LY)/.test(noAcc(n).toUpperCase())) continue;
      if (DB.gv.some(g => normName(g.hoTen) === n)) continue;
      DB.gv.push({ id: uid(), hoTen: n, sdt: phoneText(r[1]), chucVu: String(r[2] || '').trim(), active: true, uses: 0, alias: [] }); rep.gv++; }
    recomputeShorts();
  }
  // 2. Kho mã ĐKI
  const dS = wb.Sheets['data MÃ ĐKI'] || wb.Sheets[wb.SheetNames.find(n => /data.*m/i.test(n) && /ki/i.test(normKey(n)))];
  if (dS) { const res = rowsFromAoa(sheetAoa(dS)); if (res) { const u = upsertKho(res.rows, 'File 1 – data MÃ ĐKI'); rep.kho = u.add + u.upd; } }
  // 3. Danh sách khóa (sheet KHOA)
  const kS = wb.Sheets['KHOA']; const listInfo = {};
  if (kS) { const a = sheetAoa(kS); for (let i = 18; i < a.length; i++) { const r = a[i]; const so = parseInt(r[1]); const hang = String(r[2] || '').trim().toUpperCase(); if (!so || !/^[A-Z0-9]{1,6}$/.test(hang)) continue; listInfo[`${hang}-${pad2(so)}`] = { hang, so, ngayKG: anyToISO(r[3]), ngayBG: anyToISO(r[4]), gvText: String(r[5] || '').trim() }; } }
  // 4. Từng sheet khóa
  const names = new Set(Object.keys(listInfo));
  wb.SheetNames.forEach(n => { const m = n.match(KSHEET); if (m && +m[2] > 0) names.add(`${m[1].toUpperCase()}-${pad2(+m[2])}`); });
  for (const code of names) {
    const [hang, soS] = code.split('-'); const so = +soS;
    if (DB.khoa.some(k => k.hang === hang && k.so === so)) { rep.skip++; continue; }
    const info = listInfo[code] || {}; const ws = wb.Sheets[code] || wb.Sheets[`${hang}-${so}`];
    let ngayKG = info.ngayKG || '', ngayBG = info.ngayBG || '', gvText = info.gvText || '';
    if (ws) { const a = sheetAoa(ws); const r3 = a[2] || []; ngayKG = ngayKG || anyToISO(r3[1]); ngayBG = ngayBG || anyToISO(r3[4]); gvText = gvText || String(r3[7] || '').trim(); }
    if (!DB.hang.some(h => h.code === hang)) DB.hang.push({ code: hang, name: hang, days: 70 });
    const k = { id: uid(), hang, so, ngayKG, ngayBG, gvText, ghiChu: 'Nhập từ file Excel cũ', createdAt: new Date().toISOString() };
    DB.khoa.push(k); rep.khoa++;
    if (!ws) continue;
    const aoa = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '' });
    let hr = aoa.findIndex(r => normKey(r[1]) === 'hovaten'); if (hr < 0) continue;
    const m = mapHeader(aoa[hr]); const H = aoa[hr];
    const maIdx = H.findIndex(c => normKey(c) === 'madki');
    const extra = ['ghichu', 'hocphi', 'trangthai'].map(x => H.findIndex(c => normKey(c) === x));
    for (let i = hr + 1; i < aoa.length; i++) {
      const r = aoa[i]; const hoTen = normName(r[m.hoTen ?? 1]); if (!hoTen) continue;
      const h = { id: uid(), khoaId: k.id, hoTen, ngaySinh: dobText(r[m.ngaySinh ?? 2]), cccd: normCCCD(r[m.cccd ?? 3]), sdt: phoneText(r[m.sdt ?? 4]), diaChi: String(r[m.diaChi ?? 5] || '').trim(), order: i - hr - 1, gvText: String(r[m.gv ?? 6] || '').trim(), ghiChu: '' };
      if (maIdx >= 0) { h.maDK = String(r[maIdx] || '').trim(); if (!maOK(h.maDK)) { if (MA_RE.test(h.maDK)) h.maNguon = h.maDK; h.maDK = ''; } if (h.maDK) { h.soHS = soHSText(r[maIdx + 1]); h.gioiTinh = String(r[maIdx + 4] || ''); h.quocTich = String(r[maIdx + 5] || ''); } }

    if (!n || !await confirmBox('Bỏ dùng mã 52003?', `<p><b>${n}</b> học viên ở ${t.map(([k]) => kCode(k)).join(', ')} sẽ trở lại trạng thái <b>thiếu mã ĐKI</b> (mã 52003 vẫn giữ ở mã nguồn).</p>`, 'Bỏ dùng', true)) return;

/* ---- Nạp SĐT hàng loạt (khớp CCCD, rồi họ tên + ngày sinh) ---- */
async function importSdt(file, k) {
  try {
    const s = await sniffFile(file);
    if (s.kind !== 'list' || s.map.sdt == null) { toast('Cần file có cột Số điện thoại + CCCD (hoặc Họ tên + Ngày sinh).', 'err', 7000); return; }
    const pool = k ? hvOf(k.id) : DB.hv.filter(h => !isLocked(khoaById(h.khoaId)));
    const fill = [], diff = [], none = [];
    for (const r of s.rows) {
      if (!r.sdt) continue;
      const h = pool.find(x => r.cccd && x.cccd === r.cccd) || pool.find(x => x.hoTen === r.hoTen && r.ngaySinh && x.ngaySinh === r.ngaySinh);
      if (!h) { none.push(r); continue; }
      if (!h.sdt) fill.push([h, r.sdt]); else if (h.sdt !== r.sdt) diff.push([h, r.sdt]);
    }
    const ok = await modal('Nạp số điện thoại', `<p>File <b>${esc(file.name)}</b>: điền mới <b>${fill.length}</b> học viên${k ? ' trong ' + kCode(k) : ''}.</p>
      ${diff.length ? `<div class="note small"><b>${diff.length}</b> người đã có SĐT khác: ${diff.slice(0, 15).map(([h, p]) => `${esc(h.hoTen)} (${esc(h.sdt)} → ${esc(p)})`).join('; ')}${diff.length > 15 ? '…' : ''}<br><label><input type="checkbox" id="sdO"> Ghi đè các số này</label></div>` : ''}
      ${none.length ? `<p class="small muted">${none.length} dòng không khớp học viên nào (khóa đã đóng sổ không được sửa).</p>` : ''}`,
      [{ t: 'Hủy', v: null }, { t: 'Nạp', cls: 'pri', v: bg => ({ over: !!$('#sdO', bg)?.checked }) }]);
    if (!ok) return;
    fill.forEach(([h, p]) => h.sdt = p); if (ok.over) diff.forEach(([h, p]) => h.sdt = p);
    const n = fill.length + (ok.over ? diff.length : 0);
    commit(`Nạp SĐT từ ${file.name}: ${n} HV`); toast(`Đã cập nhật SĐT cho ${n} học viên.`, 'ok'); render();
  } catch (e) { toast('Lỗi đọc file: ' + e.message, 'err'); }
}

function setupDrop(zone, onFile) {
  zone.addEventListener('click', () => { const p = $('#filePick'); p.value = ''; p.onchange = () => p.files[0] && onFile(p.files[0]); p.click(); });
  zone.addEventListener('dragover', e => { e.preventDefault(); e.stopPropagation(); zone.classList.add('over'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('over'));
  zone.addEventListener('drop', e => { e.preventDefault(); e.stopPropagation(); zone.classList.remove('over'); $('#gdrop').classList.remove('show'); const f = e.dataTransfer.files[0]; f && onFile(f); });
}
async function startImportFile(k, file) {
  try {
    const s = await sniffFile(file);
    if (s.kind !== 'list') { toast('Không tìm thấy bảng danh sách (cần có cột Họ và tên + CCCD/Ngày sinh).', 'err', 6000); return; }
    await startDraft(k, s.rows, file.name, s.map.maDK != null);
  } catch (e) { toast('Không đọc được file: ' + e.message, 'err', 6000); }
}
/* Kiểm hồ sơ: chỉ CẢNH BÁO, không chặn */
function hvWarn(h, k) {
  const w = []; const c = h.cccd || '';
  if (!c) w.push('thiếu CCCD');
  else if (/^\d{9}$/.test(c)) w.push('CMND 9 số');
  else if (!/^\d{12}$/.test(c)) w.push('CCCD không đủ 12 số');
  const m = String(h.ngaySinh || '').match(/(\d{1,2})\/(\d{1,2})\/(\d{4})$/) || String(h.ngaySinh || '').match(/^()()(\d{4})$/);
  const y = m ? +m[3] : 0;
  if (y && /^\d{12}$/.test(c)) { const cen = +c[3] <= 1 ? 1900 : +c[3] <= 3 ? 2000 : 2100; if (cen + +c.slice(4, 6) !== y) w.push('CCCD lệch năm sinh'); }
  const minAge = hangOf(k?.hang).minAge ?? 18; const ref = k?.ngayBG || k?.ngayKG;
  if (y && ref && minAge) {
    const [ry, rm, rd] = ref.split('-').map(Number); const bm = +m[2] || 1, bd = +m[1] || 1;
    const age = ry - y - ((rm < bm || (rm === bm && rd < bd)) ? 1 : 0);
    if (age < minAge) w.push(`chưa đủ ${minAge} tuổi tại ngày ${k.ngayBG ? 'BG' : 'KG'}`);
  }
  return w;
}
/* Ai đang ở khóa khác CÙNG HẠNG chưa kết thúc → có thể là trùng hồ sơ */
function activeDup(cccd, k) { if (!cccd) return []; return DB.hv.filter(h => h.cccd === cccd && h.khoaId !== k.id && (h.tt || 'hoc') === 'hoc').map(h => khoaById(h.khoaId)).filter(x => x && x.hang === k.hang && kStatus(x).o < 2); }
async function startDraft(k, rows, src, hasMa) {
  if (lockGuard(k)) return;
  const old = DB.drafts[k.id];
  if (old && old.rows.some(r => r.gvId) && !await confirmBox('Thay danh sách đang chọn dở?', `<p>Khóa ${kCode(k)} đang có danh sách nháp với <b>${old.rows.filter(r => r.gvId).length}</b> người đã chọn GV (nguồn: ${esc(old.src)}).</p><p>Nạp danh sách mới sẽ <b>bỏ hết</b> các lựa chọn đó.</p>`, 'Bỏ và nạp mới', true)) return;
  const inKhoa = new Set(hvOf(k.id).map(h => h.cccd).filter(Boolean));
  const seen = new Set(); const dr = [];
  for (const r of rows) {
    if (r.cccd && seen.has(r.cccd)) continue; if (r.cccd) seen.add(r.cccd);
    const other = r.cccd ? DB.hv.filter(h => h.cccd === r.cccd && h.khoaId !== k.id).map(h => kCode(khoaById(h.khoaId))) : [];
    const dup = activeDup(r.cccd, k).map(kCode);
    let gvId = ''; const g = r.gvText && findGvByText(r.gvText); if (g && !dup.length) gvId = g.id;
    // Mã đăng ký trong file danh sách luôn là MÃ NGUỒN; mã ĐKI chỉ lấy từ kho mã ĐKI
    dr.push({ ...r, maNguon: r.maDK, maDK: '', _id: uid(), gvId, already: inKhoa.has(r.cccd), other, dup, warn: hvWarn(r, k) });
  }
  DB.drafts[k.id] = { src, at: new Date().toISOString(), rows: dr, hasMa: !!hasMa };
  commit(); go('import', { id: k.id });
}
let paintGv = '', impOnly = '';
function isNear(r) { const a = noAcc((r.noiCuTru || '') + ' ' + (r.diaChi || '')); return (DB.settings.nearKeys || []).some(x => x && a.includes(noAcc(x))); }

  const bulk = () => { const n = $$('.ck:checked', el).length; const b = $('#iBulk', el); b.style.display = n ? '' : 'none'; b.innerHTML = `<option value="">Gán GV cho ${n} dòng đã tick…</option>${gvSorted().map(g => `<option value="${g.id}">${esc(g.tenGoi)}</option>`).join('')}<option value="-">(Bỏ GV — loại)</option>`; };

    ${vis.map(r => `<tr data-r="${r._id}" class="${r.gvId ? '' : 'out'} ${near && isNear(r) ? 'near' : ''}"><td><input type="checkbox" class="ck" data-r="${r._id}"></td><td class="muted">${rows.indexOf(r) + 1}</td><td><b>${esc(r.hoTen)}</b></td><td>${esc(r.ngaySinh)}</td><td class="mono">${esc(r.cccd)}</td><td class="small">${esc(r.noiCuTru || r.diaChi)}</td>
    <td class="small">${r.already ? '<span class="badge b-info">đã có trong khóa</span> ' : ''}${r.dup?.length ? `<span class="badge b-miss" title="Cùng hạng, khóa chưa kết thúc — có thể trùng hồ sơ">đang ở ${esc(r.dup.join(', '))}</span> ` : (r.other.length ? `<span class="badge b-end" title="Từng học khóa khác">từng ở ${esc(r.other.join(', '))}</span> ` : '')}${(r.warn || []).map(w => `<span class="badge b-new">${esc(w)}</span>`).join(' ')}</td>

async function finalizeImport(k) {
  if (lockGuard(k)) return;
  const dr = DB.drafts[k.id];
  dr.rows.forEach(r => { if (r.gvId && !gvById(r.gvId)) r.gvId = ''; });
  const take = dr.rows.filter(r => r.gvId); const drop = dr.rows.filter(r => !r.gvId);
  if (!take.length) { toast('Chưa chọn GV cho học viên nào.', 'err'); return; }
  const dupIn = take.filter(r => r.already); const dupAct = take.filter(r => r.dup?.length); const warn = take.filter(r => r.warn?.length);
  const byGv = {}; take.forEach(r => { const t = gvById(r.gvId).tenGoi; byGv[t] = (byGv[t] || 0) + 1; });
  const body = `<p>Đưa <b>${take.length}</b> học viên vào <b>${kCode(k)}</b>: ${Object.entries(byGv).map(([t, n]) => `${esc(t)} (${n})`).join(', ')}.</p>
   ${dupIn.length ? `<p class="note blue small">${dupIn.length} người đã có sẵn trong khóa → chỉ cập nhật GV/thông tin, không thêm trùng.</p>` : ''}
   ${dupAct.length ? `<div class="note red small"><b>${dupAct.length} người đang ở khóa ${esc(k.hang)} khác chưa kết thúc:</b> ${dupAct.map(r => esc(r.hoTen) + ' (' + esc(r.dup.join(', ')) + ')').join('; ')}.
      <label class="f" style="margin-top:8px">Xử lý<select class="in" id="fDup"><option value="">— chọn cách xử lý —</option><option value="move">Chuyển sang ${kCode(k)} (rút khỏi khóa cũ)</option><option value="both">Giữ ở cả hai khóa</option></select></label></div>` : ''}
   ${warn.length ? `<p class="note small">Cảnh báo hồ sơ (${warn.length}): ${warn.map(r => esc(r.hoTen) + ': ' + esc(r.warn.join(', '))).join('; ')}. Vẫn thêm — kiểm lại sau.</p>` : ''}
   <details><summary><b style="color:var(--red)">Loại ${drop.length} người không chọn GV</b> (bấm để xem)</summary><div class="small" style="max-height:200px;overflow:auto;margin-top:6px">${drop.map(r => esc(r.hoTen)).join(', ') || '—'}</div></details>
   <label class="small" style="display:block;margin-top:12px"><input type="checkbox" id="fSort" checked> Sắp xếp danh sách khóa theo tên (tên riêng → họ → đệm)</label>`;
  const ok = await modal('Chốt danh sách học viên', body, [{ t: 'Quay lại', v: null }, { t: `Chốt ${take.length} học viên`, cls: 'pri', v: bg => { const d = $('#fDup', bg); if (d && !d.value) { toast('Chọn cách xử lý người đang ở khóa khác.', 'err'); d.focus(); return false; } return { sort: $('#fSort', bg).checked, dup: d?.value || 'both' }; } }]);
  if (!ok) return;
  let add = 0, upd = 0, moved = 0;
  for (const r of take) {
    if (r.dup?.length && ok.dup === 'move') {
      const olds = DB.hv.filter(h => h.cccd === r.cccd && h.khoaId !== k.id && activeDup(r.cccd, k).some(x => x.id === h.khoaId));
      olds.forEach(h => logAct(`Rút ${h.hoTen} khỏi ${kCode(khoaById(h.khoaId))} (chuyển sang ${kCode(k)})`));
      olds.forEach(h => trashHv(h, `Chuyển sang ${k.hang}-${pad2(k.so)} khi chốt danh sách`)); moved += olds.length;
    }
    const ex = r.cccd && hvOf(k.id).find(h => h.cccd === r.cccd);
    const data = { hoTen: r.hoTen, ngaySinh: r.ngaySinh, cccd: r.cccd, maNguon: r.maNguon, soHS: r.soHS, gioiTinh: r.gioiTinh, quocTich: r.quocTich, diaChi: r.diaChi, noiCuTru: r.noiCuTru, ngayNhanHS: r.ngayNhanHS, gvId: r.gvId, gvText: '' };
    if (ex) { for (const [f, v] of Object.entries(data)) if (v) ex[f] = v; ex.gvGoc = ''; if (r.sdt) ex.sdt = r.sdt; upd++; }
    else { DB.hv.push({ id: uid(), khoaId: k.id, sdt: r.sdt || '', ghiChu: '', maDK: '', tt: 'hoc', thu: [], hocPhi: DB.settings.hocPhi[k.hang] || 0, ...data }); add++; }
    const g = gvById(r.gvId); g.uses = (g.uses || 0) + 1;
  }
  const list = hvOf(k.id);
  if (ok.sort) list.sort((a, b) => vnCompare(a.hoTen, b.hoTen)).forEach((h, i) => h.order = i); else { let mx = Math.max(-1, ...list.filter(h => h.order != null).map(h => h.order)); list.forEach(h => { if (h.order == null) h.order = ++mx; }); }
  const filled = fillFromKho(list);
  delete DB.drafts[k.id]; paintGv = ''; impOnly = '';
  commit(`Chốt ${add} HV mới (+${upd} cập nhật) vào ${kCode(k)}, loại ${drop.length}` + (moved ? `, rút ${moved} khỏi khóa cũ` : ''));
  toast(`Đã chốt: +${add} học viên${upd ? `, cập nhật ${upd}` : ''}, loại ${drop.length}.` + (moved ? ` Đã rút ${moved} người khỏi khóa cũ.` : '') + (filled ? ` Tự điền ${filled} mã ĐKI.` : ' Mã ĐKI sẽ tự điền khi nạp file data mã ĐKI.'), 'ok', 7000);
  go('khoaDetail', { id: k.id });
}

function vTrash(el) {
  const T = DB.trash;
  el.innerHTML = `<h1>Thùng rác</h1><p class="sub">Học viên, khóa, giáo viên bị xóa nằm ở đây ${DB.settings.trashDays} ngày rồi mới tự xóa hẳn. Khôi phục được bất cứ lúc nào trong thời gian đó.</p>
  <div class="card"><div class="tbl"><table><thead><tr><th>Loại</th><th>Nội dung</th><th>Xóa lúc</th><th>Lý do</th><th>Còn</th><th></th></tr></thead><tbody>

    if (pend && pend.data && pend.data.app === 'QLKhoaOtoCSHN') {
      const ok = await modal('Có thay đổi chưa lưu', `<p>Lần trước mất kết nối máy chủ lúc <b>${new Date(pend.at).toLocaleString('vi-VN')}</b>, trình duyệt còn giữ bản chưa lưu (${pend.data.khoa.length} khóa, ${pend.data.hv.length} HV).</p><p>Gửi lên máy chủ? Tool sẽ <b>gộp</b> với dữ liệu hiện có, không ghi đè thay đổi của máy khác.</p>`,
        [{ t: 'Bỏ bản chờ', cls: 'dan', v: 'drop' }, { t: 'Gửi lên & gộp', cls: 'pri', v: 'push' }]);
      if (ok === 'push') { try { await api('/api/state', { body: { baseRev: pend.baseRev, data: pend.data, reason: 'Gửi lại bản chờ khi mất kết nối' } }); toast('Đã gửi và gộp bản chờ.', 'ok'); } catch (e) { downloadBlob(new Blob([JSON.stringify(pend.data)]), `QLKhoaOto_BAN_CHO_${DEVICE}.json`); toast('Không gộp được bản chờ (quá cũ) — đã tải về file để đối chiếu.', 'err', 9000); } const st2 = await api('/api/state'); DB = migrate(st2.data); serverRev = st2.rev; }
      await kvDel('pending');
    }
    LOADED = true;
    let ch = autoCloseKhoa(); const pt = purgeTrash(); if (pt) logAct(`Dọn ${pt} mục quá hạn trong thùng rác`);
    if (ch || pt) commit();
  } catch (e) {
    $('#view').innerHTML = `<div class="card note red" style="max-width:720px"><h2>Không tải được dữ liệu</h2><p>${esc(e.message)}</p><p>Để an toàn, tool <b>không cho thao tác</b> khi chưa tải được dữ liệu (tránh ghi đè bằng bản trống).</p><button class="btn pri" onclick="location.reload()">Tải lại</button></div>`;
    return;
  }
  const [v, id] = location.hash.replace('#', '').split('/');
  if (v && v !== 'import') ROUTE = { v, id }; render();
  setTimeout(dailyUpdateCheck, 3000);
  setTimeout(hsNotify, 2000); setInterval(() => { hsNotify(); refreshCounts(); }, 60 * 60e3);
})();
</script>
</body>
</html>
